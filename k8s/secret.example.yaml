# Example Secret holding the MCP API key(s).
#
# The entrypoint reads the file mounted at /run/secrets/mcp/api-keys (env
# MCP_API_KEY_FILE, one key per line) and requires it to exist and be
# non-empty unless MCP_AUTH_DISABLED=1. supergateway answers 401 to any
# request that does not present one of these keys (Authorization: Bearer or
# X-API-Key).
#
# scripts/deploy.sh generates a random key with `openssl rand -hex 24` if the
# Secret is missing. This file is just a template -- the value below is a
# placeholder. NEVER commit real keys.
apiVersion: v1
kind: Secret
metadata:
  name: firefox-mcp-auth
  namespace: firefox-mcp
  labels:
    app: firefox-mcp
    app.kubernetes.io/name: firefox-mcp-server
type: Opaque
stringData:
  api-keys: CHANGE_ME
