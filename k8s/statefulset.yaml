# One stateful Firefox + MCP server. The persistent profile lives on a PVC
# (volumeClaimTemplate) so logins / cookies survive pod restarts.
#
# Requires a StorageClass (for the volumeClaimTemplate). On k3s that is
# `local-path` by default.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firefox-mcp
  namespace: firefox-mcp
  labels:
    app: firefox-mcp
    app.kubernetes.io/name: firefox-mcp-server
spec:
  replicas: 1
  serviceName: firefox-mcp
  selector:
    matchLabels:
      app: firefox-mcp
  template:
    metadata:
      labels:
        app: firefox-mcp
        app.kubernetes.io/name: firefox-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Firefox is memory-hungry; give it headroom and a bigger /dev/shm.
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        # API key(s) for supergateway. The key `api-keys` is exposed as the
        # file /run/secrets/mcp/api-keys (the entrypoint's default
        # MCP_API_KEY_FILE). fsGroup 1000 makes it readable by the container.
        - name: mcp-auth
          secret:
            secretName: firefox-mcp-auth
            defaultMode: 0440
      containers:
        - name: firefox-mcp
          # <-- replaced by scripts/deploy.sh (or your GitOps) with the real image
          image: REPLACE_WITH_REGISTRY/firefox-mcp-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mcp
              containerPort: 8931
              protocol: TCP
          env:
            # Tool surface: comma-separated list of tool modules, passed to the
            # MCP server as --tools. This default is the "basic" preset minus
            # webextension (can persist an extension into the logged-in
            # profile) and screencast (needs Firefox 154+, newer than the
            # Debian ESR in the image).
            - name: MCP_TOOLS
              value: "pages,snapshot,input,screenshot,print,downloads,script,utilities,management"
            # Used only if MCP_TOOLS is set to the empty string.
            - name: TOOL_PRESET
              value: "basic"     # slim | basic | developer | mozilla | all
            # Abandoned MCP sessions are reaped after this long (ms), which
            # releases the shared Firefox profile lock. 900000 = 15 min.
            - name: MCP_SESSION_TIMEOUT_MS
              value: "900000"
            - name: VIEWPORT
              value: "1280x720"
          resources:
            requests:
              cpu: "300m"
              memory: "900Mi"
            limits:
              cpu: "2"
              memory: "3Gi"
          # supergateway answers GET /healthz with 200 "ok" before the API-key
          # check, so probes work without a key.
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: ff-profile
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
            - name: mcp-auth
              mountPath: /run/secrets/mcp
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: ff-profile
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
